name: Deploy WebUSB page to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - webusb/index.html
      - firmware/**
      - marvell_flash_tool/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      # Publish only the page and the images it fetches (BUNDLED_IMAGES in index.html).
      # NAND images come from firmware/ (Git LFS); marvell_flash_tool/83_IMAGE is not published.
      - name: Assemble site
        run: |
          mkdir -p _site/images
          cp webusb/index.html _site/
          cp -r firmware _site/firmware
          for name in bcm_erom.bin.usb sysinit.img bootloader.img drm_erom.img 08_IMAGE 09_IMAGE 79_IMAGE; do
            cp "marvell_flash_tool/$name" "_site/images/$name"
          done

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
